<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a14" media="(prefers-color-scheme: dark)">
<title>京都・宇治・大阪 旅行手冊</title>
<style>
:root{
  --bg:#f7f3e8;--card:#fffdf6;--ink:#2a3325;--sub:#6b7566;--line:#e5dfcb;
  --g:#5f8a3a;--g-d:#3f6226;--g-soft:#e6efd6;--lav:#b7a7e0;--lav-soft:#ece6fa;
  --warn:#c4572e;--warn-soft:#fbe6dc;--shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(60,70,40,.08);
  --d1:#e2725b;--d2:#d9a441;--d3:#5f8a3a;--d4:#4a90b8;--d5:#8e7cc3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161a14;--card:#1f241c;--ink:#ecefe3;--sub:#a4ad9b;--line:#323a2d;
    --g:#9cc56d;--g-d:#b9de8c;--g-soft:#2a3522;--lav:#a898d8;--lav-soft:#2d2942;
    --warn:#ef8a62;--warn-soft:#3a2a22;--shadow:0 6px 18px rgba(0,0,0,.35);
    --d1:#ee8c76;--d2:#e6b95e;--d3:#9cc56d;--d4:#6fb0d6;--d5:#a898d8;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;padding:0 16px calc(48px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:680px;margin:0 auto}
a{color:inherit}
nav.top{position:sticky;top:0;z-index:50;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .in{display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto}
nav.top ul{list-style:none;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.top ul::-webkit-scrollbar{display:none}
nav.top a{display:block;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--sub)}
nav.top a.on{background:var(--g);color:#fff}
nav.top a.dy{font-variant-numeric:tabular-nums}
nav.top .sep{width:1px;background:var(--line);margin:4px 4px;flex:none}
.lang{flex:none;border:1.5px solid var(--g);background:var(--card);color:var(--g-d);border-radius:999px;font:700 13px/1 inherit;font-family:inherit;padding:8px 12px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.top a.on{color:#14200c}}
section,#hero,.day{scroll-margin-top:64px}
header{padding:20px 0 8px}
header h1{font-size:26px;line-height:1.25;letter-spacing:.02em}
header p{color:var(--sub);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
section{margin-top:26px}
h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
h2 .bar{width:6px;height:20px;border-radius:3px;background:var(--g)}
.hero{background:linear-gradient(160deg,var(--g-soft),var(--card) 70%);margin-top:14px}
.hero .lab{font-size:12px;letter-spacing:.14em;color:var(--g-d);font-weight:700}
.hero h3{font-size:21px;line-height:1.35;margin:6px 0 2px}
.hero .meta{font-size:14px;color:var(--sub)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 10px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 0 8px;text-align:center}
.cd b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--g-d)}
.cd span{font-size:12px;color:var(--sub)}
.hero .loc{font-size:13px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--g);color:var(--g-d);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;font-weight:600;cursor:pointer;font-family:inherit}
.btn.solid{background:var(--g);color:#fff;border-color:var(--g)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.solid{color:#14200c}}
.note{font-size:12.5px;color:var(--sub);margin-top:8px}
/* summary */
.sumlist{display:grid;gap:12px}
a.sum{display:block;text-decoration:none;border-left:6px solid var(--c)}
.sum .n{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--c)}
.sum h3{font-size:17px;line-height:1.35}
.sum .rg{font-size:13px;color:var(--sub);margin-top:2px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:10px;font-size:13.5px}
.chain .st{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 8px;white-space:nowrap}
.chain .mvt{font-size:11.5px;color:var(--sub);white-space:nowrap}
.chain .mvt::before{content:"› "}
.chain .mvt::after{content:" ›"}
.skip .st,.chain .skip{text-decoration:line-through;opacity:.5}
/* bookings */
.bk{display:grid;gap:12px}
.bk .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bk h4{font-size:15px;margin-bottom:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--g-soft);color:var(--g-d);margin-right:6px;vertical-align:1px}
.tag.lav{background:var(--lav-soft);color:#6b58b0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.lav{color:#cbbff0}}
.fl{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.fl .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.fl .t small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.fl .mid{flex:1;text-align:center;font-size:12px;color:var(--sub);border-bottom:2px dotted var(--line);padding-bottom:2px}
.kv{font-size:14px;color:var(--sub)}
.kv b{color:var(--ink);font-weight:600}
/* matcha tracker */
.mt{margin-bottom:14px}
.mt h4{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 13px;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#14200c}}
.mini{margin-top:6px;margin-right:6px}
/* days */
.day{margin-bottom:14px;padding:0;overflow:hidden}
.dh{padding:16px 18px 12px;border-left:6px solid var(--c)}
.dh .n{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--c)}
.dh h3{font-size:18px;line-height:1.35}
.dh .sub{font-size:13.5px;color:var(--sub)}
.dh .lodge{font-size:13px;margin-top:6px;color:var(--sub)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px 24px}
details.rm{border-top:1px dashed var(--line);padding:0 18px}
details.rm summary{cursor:pointer;padding:11px 0;font-size:14px;font-weight:600;color:var(--g-d);list-style:none}
details.rm summary::-webkit-details-marker{display:none}
details.rm summary::after{content:"＋";float:right}
details.rm[open] summary::after{content:"－"}
details.rm svg{width:100%;height:auto;display:block;margin-bottom:12px;border-radius:12px;background:var(--bg)}
.tl{list-style:none;padding:4px 18px 8px;border-top:1px solid var(--line)}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--c);padding-top:1px}
.tl .tm small{display:block;font-weight:500;font-size:11px;color:var(--sub)}
.tl .ti{font-weight:650;font-size:15.5px;line-height:1.4}
.tl .ds{font-size:13.5px;color:var(--sub);margin-top:2px}
.tl .mv{font-size:12px;color:var(--sub);margin-top:2px}
.tl .go{display:inline-block;margin-top:5px;margin-right:8px;font-size:13px;color:var(--g-d);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--g)}
li.skip .ti,li.skip .ds{text-decoration:line-through;opacity:.5}
li.skip .sk{display:inline-block}
.sk{display:none;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;background:var(--g-soft);color:var(--g-d)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.badge.book{background:var(--warn-soft);color:var(--warn)}
.badge.warn{background:var(--lav-soft);color:#6b58b0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.warn{color:#cbbff0}}
li.sp{background:linear-gradient(90deg,var(--warn-soft),transparent 60%);margin:0 -18px;padding-left:18px;padding-right:18px}
.todo{list-style:none;padding:0}
.todo li{padding:11px 0 11px 22px;border-bottom:1px dashed var(--line);position:relative}
.todo li:last-child{border-bottom:0}
.todo li::before{content:"";position:absolute;left:2px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--g)}
.tips{list-style:none;padding:0;display:grid;gap:12px}
.tips li{padding-left:16px;position:relative;font-size:15px}
.tips li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--lav)}
.tips b{color:var(--g-d)}
footer{text-align:center;margin-top:34px;color:var(--sub);font-size:13px}

nav.top{overflow:visible}
.ddb{display:block;white-space:nowrap;border:0;background:transparent;font:600 14px/1.4 inherit;font-family:inherit;padding:6px 12px;border-radius:999px;color:var(--sub);cursor:pointer}
.ddb.on{background:var(--g);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ddb.on{color:#14200c}}
.ddb::after{content:" ▾";font-size:11px}
.ddb[aria-expanded="true"]::after{content:" ▴"}
.ddp{position:absolute;left:16px;right:16px;top:calc(100% + 6px);max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:none}
.ddp.open{display:block}
nav.top .ddp a{color:var(--ink);font-weight:500;display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:baseline;text-decoration:none;padding:10px 12px;border-radius:10px;font-size:14.5px}
.ddp a b{font-variant-numeric:tabular-nums;color:var(--c)}
nav.top .ddp a.on{background:var(--g-soft);color:var(--ink)}
details.fold{scroll-margin-top:64px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0;flex:1}
details.fold>summary::after{content:"＋";font-size:18px;color:var(--g-d);padding:0 4px}
details.fold[open]>summary::after{content:"－"}
details.fold[open]>summary{margin-bottom:12px}
.mask{position:fixed;inset:0;z-index:100;background:rgba(20,26,16,.45);display:none;align-items:center;justify-content:center;padding:24px}
.mask.open{display:flex}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;max-width:340px;width:100%}
.dlg p{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.5}
.dlg .acts{padding:0;justify-content:flex-end}
</style>
</head>
<body>
<nav class="top"><div class="in"><ul id="navl"></ul><button class="lang" id="langbtn" type="button" aria-label="Language">EN</button></div><div class="ddp" id="ddp"></div></nav>
<div class="wrap">
<header>
  <h1 id="h1"></h1>
  <p id="hsub"></p>
</header>

<div id="hero" class="card hero"></div>

<section>
  <details class="fold" id="sum-sec">
    <summary><h2><span class="bar"></span><span id="t-sum"></span></h2></summary>
    <div class="sumlist" id="sumlist"></div>
  </details>
</section>

<section>
  <details class="fold" id="bookings">
    <summary><h2><span class="bar"></span><span id="t-bk"></span></h2></summary>
    <div class="bk" id="bk"></div>
  </details>
</section>

<section id="days">
  <h2><span class="bar"></span><span id="t-days"></span></h2>
  <div class="card mt" id="mt"></div>
  <p class="note" style="margin:0 0 12px" id="daynote"></p>
  <div id="daylist"></div>
</section>

<section id="todo">
  <h2><span class="bar"></span><span id="t-todo"></span></h2>
  <div class="card"><ul class="todo" id="todolist"></ul></div>
</section>

<section id="tips">
  <h2><span class="bar"></span><span id="t-tips"></span></h2>
  <div class="card"><ul class="tips" id="tiplist"></ul></div>
</section>

<footer id="foot"></footer>
</div>
<div class="mask" id="mask"><div class="dlg" role="dialog" aria-modal="true"><p id="dmsg"></p><div class="acts"><button type="button" class="btn" id="dno"></button><button type="button" class="btn solid" id="dyes"></button></div></div></div>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function navUrl(p){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(P[p].q)+"&travelmode=transit"}
function multiUrl(keys){
  var seen=[];keys.forEach(function(x){if(seen[seen.length-1]!==x)seen.push(x)});
  if(!seen.length)return "https://www.google.com/maps";
  if(seen.length>10)seen=seen.slice(0,10);
  var dest=seen[seen.length-1],wp=seen.slice(0,-1).map(function(x){return P[x].q}).join("|");
  var u="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(P[dest].q);
  if(wp)u+="&waypoints="+encodeURIComponent(wp);
  return u;
}
function instant(day,it){return Date.parse("2026-"+day.date.replace("/","-")+"T"+it.t+":00"+(it.tz||JP))}
function tzLabel(it){return T(it.tz===TW?U.tw:U.jp)}
function wd(d){return T(WD[d.date])}
function dateLabel(d){return lang==="en"?(d.date+" ("+wd(d)+")"):(d.date+"（"+wd(d)+"）")}

/* ================= STATE: bought ================= */
var bought={};
function loadBought(){
  var s="";
  try{var h=location.hash.match(/[#&]b=([^&]*)/);if(h){s=decodeURIComponent(h[1]);try{localStorage.setItem("kt-bought",s)}catch(e){}}else s=localStorage.getItem("kt-bought")||""}catch(e){}
  bought={};s.split(",").forEach(function(k){if(SHOPS[k])bought[k]=1});
}
function saveBought(){
  var s=Object.keys(bought).filter(function(k){return bought[k]}).join(",");
  try{localStorage.setItem("kt-bought",s)}catch(e){}
}
function isSkipped(it){return !!(it.needs&&it.needs.length&&it.needs.every(function(k){return bought[k]}))}

/* ================= EVENTS ================= */
var EVENTS=[];
DAYS.forEach(function(d,di){d.items.forEach(function(it){EVENTS.push({ts:instant(d,it),day:di,it:it,d:d})})});
EVENTS.sort(function(a,b){return a.ts-b.ts});

/* ================= HERO ================= */
function viewerLine(ts){
  try{
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(!tz||tz==="Asia/Tokyo")return "";
    var f=new Intl.DateTimeFormat(lang==="en"?"en":"zh-Hant",{timeZone:tz,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
    return T(U.devTime)+" ("+tz+"): "+f.format(new Date(ts));
  }catch(e){return ""}
}
var heroKey=null;
function renderHero(force){
  var now=Date.now(),nx=null,i;
  for(i=0;i<EVENTS.length;i++){if(EVENTS[i].ts>now&&!isSkipped(EVENTS[i].it)){nx=EVENTS[i];break}}
  var el=$("hero");
  if(!nx){
    el.innerHTML='<div class="lab">'+esc(T(U.now))+'</div><h3>'+esc(T(U.done))+'</h3><p class="meta">'+esc(T(U.doneSub))+'</p>';
    heroKey=null;return;
  }
  var key=nx.ts+nx.it.ti[0]+lang;
  if(force||heroKey!==key){
    heroKey=key;
    el.innerHTML='<div class="lab">'+esc(T(U.now))+'</div>'+
     '<h3>'+esc(T(nx.it.ti))+'</h3>'+
     '<p class="meta">'+esc(dateLabel(nx.d))+' '+esc(nx.it.t)+' '+esc(tzLabel(nx.it))+'</p>'+
     '<div class="cd" role="timer" aria-live="off"><div><b id="cd-d">0</b><span>'+T(U.d)+'</span></div><div><b id="cd-h">00</b><span>'+T(U.h)+'</span></div><div><b id="cd-m">00</b><span>'+T(U.m)+'</span></div><div><b id="cd-s">00</b><span>'+T(U.s)+'</span></div></div>'+
     '<p class="loc" id="vl"></p>'+
     '<p style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="'+navUrl(nx.it.p)+'">'+esc(T(U.navTo)+T(P[nx.it.p].n))+'</a></p>';
    var v=viewerLine(nx.ts);$("vl").textContent=v;$("vl").style.display=v?"":"none";
  }
  var diff=Math.max(0,Math.floor((nx.ts-now)/1000));
  var d=Math.floor(diff/86400),h=Math.floor(diff%86400/3600),m=Math.floor(diff%3600/60),s=diff%60;
  $("cd-d").textContent=d;$("cd-h").textContent=pad(h);$("cd-m").textContent=pad(m);$("cd-s").textContent=pad(s);
}

/* ================= SUMMARY ================= */
function renderSummary(){
  var h="";
  DAYS.forEach(function(d,i){
    var first=d.items[0],last=d.items[d.items.length-1];
    var chain="",prev=null;
    d.items.forEach(function(it){
      if(!it.s)return;
      var need=it.needs?' data-needs="'+it.needs.join(",")+'"':"";
      if(prev&&it.mv)chain+='<span class="mvt">'+esc(T(it.mv))+'</span>';
      chain+='<span class="st"'+need+'>'+esc(T(P[it.p].n).replace(/[（(].*/,""))+'</span>';
      prev=it;
    });
    h+='<a class="card sum" style="--c:'+COLORS[i]+'" href="#day-'+(i+1)+'"><div class="n">DAY '+(i+1)+' ・ '+esc(dateLabel(d))+'</div><h3>'+esc(T(d.title))+'</h3>'+
      '<p class="rg">'+esc(first.t+" → "+last.t+" ・ "+T(d.lodge))+'</p><div class="chain">'+chain+'</div></a>';
  });
  $("sumlist").innerHTML=h;
}

/* ================= BOOKINGS ================= */
function renderBookings(){
  var h="";
  BOOK.flights.forEach(function(f){
    h+='<div class="card"><div class="row"><div><span class="tag">'+esc(T(U.flight))+'</span><b>'+esc(T(U.tigerair))+' '+f.no+'</b></div><div class="kv">'+esc(T(f.dt))+'</div></div>'+
    '<div class="fl"><div class="t">'+f.dep+'<small>'+esc(T(f.dz))+'</small></div><div class="mid">'+esc(T(f.dur))+'</div><div class="t" style="text-align:right">'+f.arr+'<small>'+esc(T(f.az))+'</small></div></div>'+
    '<div class="kv">'+esc(T(f.from))+' → '+esc(T(f.to))+'</div></div>';
  });
  BOOK.hotels.forEach(function(x){
    h+='<div class="card"><div class="row"><div><span class="tag lav">'+esc(T(U.stay))+'</span><b>'+esc(T(x.zh))+'</b></div><div class="kv">'+esc(T(x.nt))+'</div></div>'+
    '<h4 style="margin-top:8px">'+esc(x.name)+'</h4>'+
    '<p class="kv">'+esc(x.addr)+'</p>'+
    '<p class="kv"><b>'+esc(T(U.checkin))+'</b> '+esc(T(x.ci))+'　<b>'+esc(T(U.checkout))+'</b> '+esc(T(x.co))+'</p>'+
    '<p class="kv"><b>'+esc(T(U.tel))+'</b> <a href="tel:'+x.tel.replace(/[^+\d]/g,"")+'">'+x.tel+'</a></p>'+
    '<p style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="'+navUrl(x.p)+'">'+esc(T(U.navHotel))+'</a></p></div>';
  });
  $("bk").innerHTML=h;
}

/* ================= DAYS ================= */
function dayRouteSvg(keys,color){
  var pts=[];keys.forEach(function(k){if(!pts.length||pts[pts.length-1]!==k)pts.push(k)});
  if(pts.length<2)return "";
  var W=340,H=220,m=34;
  var lats=pts.map(function(k){return P[k].ll[0]}),lngs=pts.map(function(k){return P[k].ll[1]});
  var minLa=Math.min.apply(0,lats),maxLa=Math.max.apply(0,lats),minLn=Math.min.apply(0,lngs),maxLn=Math.max.apply(0,lngs);
  var kx=Math.cos((minLa+maxLa)/2*Math.PI/180);
  var w=Math.max((maxLn-minLn)*kx,0.002),h=Math.max(maxLa-minLa,0.002);
  var sc=Math.min((W-2*m)/w,(H-2*m)/h);
  var ox=(W-w*sc)/2,oy=(H-h*sc)/2;
  var xy=pts.map(function(k){return [ox+(P[k].ll[1]-minLn)*kx*sc, oy+(maxLa-P[k].ll[0])*sc]});
  var d=xy.map(function(a,i){return (i?"L":"M")+a[0].toFixed(1)+","+a[1].toFixed(1)}).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  xy.forEach(function(a,i){
    var lx=a[0]>W/2?-9:9,anchor=a[0]>W/2?"end":"start";
    s+='<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="9" fill="'+color+'" stroke="var(--card)" stroke-width="2"/><text x="'+a[0].toFixed(1)+'" y="'+(a[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">'+(i+1)+'</text>'+
    '<text x="'+(a[0]+lx*1.9).toFixed(1)+'" y="'+(a[1]-10).toFixed(1)+'" text-anchor="'+anchor+'" font-size="10.5" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">'+esc(T(P[pts[i]].n).replace(/[（(].*/,""))+'</text>';
  });
  return s+'</svg>';
}
function buyButtons(it){
  if(!it.buys)return "";
  return it.buys.map(function(k){
    return '<button type="button" class="chip mini" data-shop="'+k+'" aria-pressed="false">'+esc(T(SHOPS[k])+" · "+T(U.bought))+'</button>';
  }).join("");
}
function renderMT(){
  var h='<h4>'+esc(T(U.mtTitle))+'</h4><p class="note" style="margin:2px 0 0">'+esc(T(U.mtHint))+'</p><div class="chips">';
  SHOPORDER.forEach(function(k){h+='<button type="button" class="chip" data-shop="'+k+'" aria-pressed="false">'+esc(T(SHOPS[k]))+'</button>'});
  h+='</div><div class="acts" style="padding:0"><button type="button" class="btn" id="cpy">'+esc(T(U.copy))+'</button><button type="button" class="btn" id="clr">'+esc(T(U.clear))+'</button></div><p class="note">'+esc(T(U.syncNote))+'</p>';
  $("mt").innerHTML=h;
}
function renderDays(){
  var h="";
  DAYS.forEach(function(d,i){
    h+='<article class="card day" id="day-'+(i+1)+'" style="--c:'+COLORS[i]+'">'+
     '<div class="dh"><div class="n">DAY '+(i+1)+' ・ '+esc(dateLabel(d))+'</div><h3>'+esc(T(d.title))+'</h3><p class="sub">'+esc(T(d.sub))+'</p><p class="lodge">'+esc(T(d.lodge))+'</p></div>'+
     '<div class="acts"><a class="btn solid" data-multi="'+i+'" target="_blank" rel="noopener" href="#">'+esc(T(U.allNav))+'</a></div>'+
     '<details class="rm"><summary>'+esc(T(U.route))+'</summary><div data-rmap="'+i+'"></div><p class="note" style="margin-top:-4px;padding-bottom:12px">'+esc(T(U.routeNote))+'</p></details>'+
     '<ul class="tl">';
    d.items.forEach(function(it){
      var tzn=it.tz?'<small>'+esc(T(it.tz===TW?["台灣","Taiwan"]:["日本","Japan"]))+'</small>':"";
      var need=it.needs?' data-needs="'+it.needs.join(",")+'"':"";
      h+='<li class="'+(it.tag==="book"?"sp":"")+'"'+need+'><div class="tm">'+it.t+tzn+'</div><div><div class="ti">'+esc(T(it.ti))+(it.tag?'<span class="badge '+it.tag+'">'+esc(T(U[it.tag]))+'</span>':'')+'<span class="sk">'+esc(T(U.skipTag))+'</span></div>'+
       (T(it.ds)?'<div class="ds">'+esc(T(it.ds))+'</div>':'')+
       (it.mv?'<div class="mv">↓ '+esc(T(it.mv))+'</div>':'')+
       '<a class="go" target="_blank" rel="noopener" href="'+navUrl(it.p)+'">'+esc(T(U.navTo.map?U.navTo:U.navTo).replace(/\s+$/,"")+" "+T(P[it.p].n))+'</a>'+
       (it.p2?'<a class="go" target="_blank" rel="noopener" href="'+navUrl(it.p2)+'">'+esc(T(U.navTo).replace(/\s+$/,"")+" "+T(P[it.p2].n))+'</a>':'')+
       (it.buys?'<div>'+buyButtons(it)+'</div>':'')+
       '</div></li>';
    });
    h+='</ul></article>';
  });
  $("daylist").innerHTML=h;
}
function applySkips(){
  [].forEach.call(document.querySelectorAll("[data-needs]"),function(el){
    var need=el.getAttribute("data-needs").split(",");
    var sk=need.every(function(k){return bought[k]});
    el.classList.toggle("skip",sk);
  });
  [].forEach.call(document.querySelectorAll("button[data-shop]"),function(b){
    b.setAttribute("aria-pressed",bought[b.getAttribute("data-shop")]?"true":"false");
  });
  DAYS.forEach(function(d,i){
    var keys=[];
    d.items.forEach(function(it){if(isSkipped(it))return;if(it.p!=="tpe"&&it.p!=="kix"||d.date!=="12/18"&&d.date!=="12/22")keys.push(it.p);if(it.p2)keys.push(it.p2)});
    var a=document.querySelector('[data-multi="'+i+'"]');if(a)a.setAttribute("href",multiUrl(keys));
    var m=document.querySelector('[data-rmap="'+i+'"]');if(m)m.innerHTML=dayRouteSvg(keys,COLORS[i]);
  });
  renderHero(true);
}
function bindShop(e){
  var b=e.target.closest("button[data-shop]");if(!b)return;
  var k=b.getAttribute("data-shop"),nm=T(SHOPS[k]);
  var msg=bought[k]?(lang==="en"?"Remove the bought mark for “"+nm+"”?":"要取消「"+nm+"」的已買到標記嗎？"):(lang==="en"?"Mark “"+nm+"” as bought?":"確認「"+nm+"」已買到？");
  confirmBox(msg,function(){bought[k]=bought[k]?0:1;saveBought();applySkips()});
}
function syncUrl(){
  var s=Object.keys(bought).filter(function(k){return bought[k]}).join(",");
  return location.origin+location.pathname+(s?"#b="+encodeURIComponent(s):"");
}
function bindMT(){
  var c=$("cpy"),x=$("clr");
  c.onclick=function(){
    var u=syncUrl(),done=function(){c.textContent=T(U.copied);setTimeout(function(){c.textContent=T(U.copy)},1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,function(){window.prompt(T(U.copy),u)})}
    else{window.prompt(T(U.copy),u)}
  };
  x.onclick=function(){confirmBox(T(U.cfmClear),function(){bought={};saveBought();try{history.replaceState(null,"",location.pathname)}catch(e){}applySkips()})};
}

/* ================= NAV ================= */
function renderNav(){
  var items=[["#hero",T(U.nNow)],["#sum-sec",T(U.nSum)],["#bookings",T(U.nBk)]];
  var h=items.map(function(x){return '<li><a href="'+x[0]+'">'+esc(x[1])+'</a></li>'}).join("");
  h+='<li><button type="button" class="ddb" id="ddbtn" aria-expanded="false" aria-haspopup="true">'+esc(T(U.nDays))+'</button></li>';
  h+=[["#todo",T(U.nTodo)],["#tips",T(U.nTips)]].map(function(x){return '<li><a href="'+x[0]+'">'+esc(x[1])+'</a></li>'}).join("");
  $("navl").innerHTML=h;
  $("ddp").innerHTML=DAYS.map(function(d,i){return '<a href="#day-'+(i+1)+'" style="--c:'+COLORS[i]+'"><b>'+d.date+'</b><span>'+esc(T(d.title))+'</span></a>'}).join("");
  $("langbtn").textContent=lang==="en"?"繁":"EN";
  $("ddbtn").onclick=function(e){e.stopPropagation();toggleDD()};
}
function toggleDD(force){
  var p=$("ddp"),open=force===undefined?!p.classList.contains("open"):force;
  p.classList.toggle("open",open);$("ddbtn").setAttribute("aria-expanded",open?"true":"false");
}
var navLinks=[];
var NAVIDS=["hero","sum-sec","bookings","day-1","day-2","day-3","day-4","day-5","todo","tips"];
function navUpdate(){
  var y=window.scrollY+90,cur="hero";
  NAVIDS.forEach(function(id){var t=$(id);if(t&&t.getBoundingClientRect().top+window.scrollY<=y)cur=id});
  var isDay=cur.indexOf("day-")===0;
  navLinks.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+cur)});
  var bt=$("ddbtn");if(bt){bt.classList.toggle("on",isDay);}
  [].forEach.call(document.querySelectorAll("#ddp a"),function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+cur)});
  var u=$("navl"),el=isDay?bt:u.querySelector('a[href="#'+cur+'"]');
  if(el&&u.scrollWidth>u.clientWidth){u.scrollLeft=el.offsetLeft-u.clientWidth/2+el.clientWidth/2}
}
/* confirm dialog */
var dlgYes=null;
function confirmBox(msg,yes){
  dlgYes=yes;$("dmsg").textContent=msg;$("dyes").textContent=T(U.yes);$("dno").textContent=T(U.no);
  $("mask").classList.add("open");$("dyes").focus();
}
function closeBox(){$("mask").classList.remove("open");dlgYes=null}

/* ================= RENDER ALL ================= */
function renderAll(){
  document.documentElement.lang=lang==="en"?"en":"zh-Hant";
  document.title=T(U.title);
  $("h1").innerHTML=lang==="en"?"Kyoto · Uji · Osaka<br>Trip Handbook":"京都・宇治・大阪<br>旅行手冊";
  $("hsub").textContent=T(U.sub);
  $("t-sum").textContent=T(U.sum);$("t-bk").textContent=T(U.bk);$("t-days").textContent=T(U.days);
  $("t-todo").textContent=T(U.todo);$("t-tips").textContent=T(U.tips);
  $("daynote").innerHTML=T(U.daynote);
  $("foot").textContent=T(U.foot);
  $("todolist").innerHTML=U.todoL.map(function(x){return "<li>"+esc(T(x))+"</li>"}).join("");
  $("tiplist").innerHTML=TIPS.map(function(x){return "<li>"+T(x)+"</li>"}).join("");
  renderNav();renderSummary();renderBookings();renderMT();renderDays();bindMT();
  navLinks=[].slice.call(document.querySelectorAll("#navl a"));
  applySkips();navUpdate();
}

/* ================= INIT ================= */
loadBought();
renderAll();
$("langbtn").onclick=function(){lang=lang==="en"?"zh":"en";try{localStorage.setItem("kt-lang",lang)}catch(e){}heroKey=null;renderAll()};
document.addEventListener("click",bindShop);
$("dyes").onclick=function(){var f=dlgYes;closeBox();if(f)f()};
$("dno").onclick=closeBox;
$("mask").addEventListener("click",function(e){if(e.target===$("mask"))closeBox()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeBox();toggleDD(false)}});
document.addEventListener("click",function(e){if(!e.target.closest("#ddp")&&!e.target.closest("#ddbtn"))toggleDD(false)});
document.addEventListener("click",function(e){
  var a=e.target.closest('nav.top a[href^="#"],#ddp a');if(!a)return;
  var t=document.querySelector(a.getAttribute("href"));if(t&&t.tagName==="DETAILS")t.open=true;toggleDD(false);
});
window.addEventListener("scroll",navUpdate,{passive:true});
window.addEventListener("hashchange",function(){if(/[#&]b=/.test(location.hash)){loadBought();applySkips()}});
setInterval(function(){renderHero(false)},1000);
document.addEventListener("visibilitychange",function(){renderHero(false)});
</script>
